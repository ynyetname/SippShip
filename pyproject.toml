[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sippship"
version = "0.3.0"
description = "Repository-aware requirement verification and bounded repair automation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.54.0",
  "streamlit==1.64.0",
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pydantic==2.13.5",
  "mcp==2.2.0",
]

[project.optional-dependencies]
dev = ["ruff==0.16.9", "build==1.6.1"]

[project.scripts]
sippship = "sippship.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sippship*"]
namespaces = true

[tool.setuptools.package-data]
sippship = ["fixtures/**/*.py", "fixtures/**/*.md", "fixtures/*.ini", "product/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
